name: Manual
on:
  workflow_dispatch:
    inputs:
      log-level:
        type: choice # 入力パラメータを特定の値に制限
        options: # 受け付ける入力値を列挙
        - info
        - warn
        - error
      greeting:
        type: string
        default: Hello
        required: true
        description: A cheerful word
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ inputs.greeting }}"